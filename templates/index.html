<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descargador de YouTube</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f9f9f9; }
        .contenedor { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); display: inline-block; }
        input[type="text"], select { width: 80%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { background-color: #ff0000; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #cc0000; }
    </style>
</head>
<body>
    <div class="contenedor">
        <h2>Descargador de Videos</h2>
        <form action="/descargar" method="POST">
            <input type="text" name="url" placeholder="Pega la URL de YouTube aquí" required><br>
            
            <select name="formato">
                <option value="1">Video (MP4)</option>
                <option value="2">Solo Audio (MP3)</option>
            </select><br>

            <button type="submit">Descargar</button>
        </form>
    </div>
</body>
</html>
